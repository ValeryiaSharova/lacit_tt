<main class="details">
  <a class="details__back" routerLink="/">Назад к задачам</a>

  @if (task(); as current) {
    <article class="details__card" [class.details__card--done]="current.status === TaskStatus.Done">
      <h1 class="details__title">{{ current.title }}</h1>
      <p class="details__description">{{ current.description }}</p>
      <p class="details__status">{{ statusLabels[current.status] }}</p>
    </article>
  } @else {
    <p class="details__missing">Задача не найдена</p>
  }
</main>
